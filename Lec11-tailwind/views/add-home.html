<!DOCTYPE html>
<html>
    <head>
        <title>Add homes</title>
        <link rel="stylesheet" href="/output.css">
    </head>
    <body class="bg-gray-50 min-h-screen flex flex-col">
        <!-- Navigation Bar -->
        <nav class="bg-white shadow flex items-center justify-between px-8 py-4">
            <a href="/" class="text-2xl font-bold text-red-500 tracking-tight">Airbnb</a>
            <div>
                <a href="/" class="text-gray-700 hover:text-red-400 font-medium px-4">Home</a>
                <a href="/host/add-homes" class="text-gray-700 hover:text-red-400 font-medium px-4">Add Homes</a>
            </div>
        </nav>
        <!-- Header -->
        <header class="bg-white shadow-md py-6 px-8 flex items-center justify-center mt-4 rounded-xl">
            <h1 class="text-3xl font-bold text-blue-600">Please Register your Home</h1>
        </header>
        <!-- Main Content -->
        <main class="flex flex-1 flex-col items-center justify-center">
            <form action="/host/add-homes" method="POST" class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md flex flex-col gap-6 mt-8">
                <input 
                    placeholder="Enter the home name" 
                    name="houseName" 
                    type="text" 
                    class="border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 text-gray-700"
                    required
                >
                <button 
                    type="submit" 
                    class="bg-black hover:bg-gray-800 text-white font-semibold py-3 px-6 rounded-lg shadow transition duration-200"
                >
                    Submit
                </button>
            </form>
        </main>
        <!-- Footer -->
        <footer class="mt-12 py-4 text-center">
            <a href="/" class="text-gray-500 hover:text-blue-500 underline">Back to Airbnb Home page</a>
        </footer>
    </body>
</html>
